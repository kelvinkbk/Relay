<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#6366F1" /> <!-- Indigo -->
    </linearGradient>
  </defs>

  <!-- Symbol -->
  <g transform="translate(0, 0)">
    <!-- Nodes -->
    <circle cx="12" cy="12" r="4.5" fill="url(#relayGrad)"/>
    <circle cx="12" cy="28" r="4.5" fill="url(#relayGrad)"/>
    
    <!-- Connecting Path -->
    <path d="M 12 12 L 28 12 A 8 8 0 0 1 28 28 L 12 28" 
          fill="none" 
          stroke="url(#relayGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>
          
    <!-- Relay Forward Leg -->
    <path d="M 23 28 L 35 40" 
          fill="none" 
          stroke="url(#relayGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="30" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="-0.5"
        fill="#0F172A">Relay</text>
</svg>
