<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="1024" height="1024">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <!-- Symbol Gradient -->
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#6366F1" /> <!-- Indigo -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- App Icon Container (Squircle) -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Relay Symbol (Centered and scaled slightly) -->
  <g transform="translate(6, 6) scale(0.75)">
    <!-- Nodes -->
    <circle cx="12" cy="12" r="4.5" fill="url(#relayGrad)"/>
    <circle cx="12" cy="28" r="4.5" fill="url(#relayGrad)"/>
    
    <!-- Connecting Path -->
    <path d="M 12 12 L 28 12 A 8 8 0 0 1 28 28 L 12 28" 
          fill="none" 
          stroke="url(#relayGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>
          
    <!-- Relay Forward Leg -->
    <path d="M 23 28 L 35 40" 
          fill="none" 
          stroke="url(#relayGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>
</svg>
